[regex]
ban = [
    '''^[aA]uthentication (?:failure|error|failed) for .*? (?:from )?\S+( via \S+)?(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^User not known to the underlying authentication module for .*? (?:from )?\S+(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^Failed (?:publickey|\S+) for (?:invalid user )?.*? from \S+(?: port \d+)?(?: ssh\d*)?.*$''',
    '''^Failed publickey for invalid user \S+|.*? from \S+(?: port \d+)?(?: ssh\d*)?.*$''',
    '''^ROOT LOGIN REFUSED FROM \S+''',
    '''^[iI](?:llegal|nvalid) user .*? (?:from )?\S+(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^User \S+|.*? (?:from )?\S+ not allowed because not listed in AllowUsers(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^User \S+|.*? (?:from )?\S+ not allowed because listed in DenyUsers(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^User \S+|.*? (?:from )?\S+ not allowed because not in any group(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^refused connect from \S+ \(\S+\)''',
    '''^Received disconnect from \S+(?: port \d+)?:\s*3: .*: Auth fail(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^User \S+|.*? (?:from )?\S+ not allowed because a group is listed in DenyGroups(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^User \S+|.*? (?:from )?\S+ not allowed because none of user's groups are listed in AllowGroups(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^pam_[a-z]+\(sshd:auth\):\s+authentication failure;(?:\s+(?:(?:logname|e?uid|tty)=\S*)){0,4}\s+ruser=\S*\s+rhost=\S+(?:\s+user=\S*)?(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^maximum authentication attempts exceeded for (?:invalid user )?.*? (?:from )?\S+(?: port \d+)?(?: ssh\d*)?(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^User \S+|.*? not allowed because account is locked(?: port \d+)?(?: \[preauth\])?\s*''',
    '''^Disconnecting(?: from)?(?: (?:invalid|authenticating)) user \S+ \S+(?: port \d+)?:\s*Change of username or service not allowed:\s*.*\[preauth\]\s*$''',
    '''^Disconnected(?: from)?(?: (?:invalid|authenticating)) user \S+|.*? (?:from )?\S+(?: port \d+)? \[preauth\]\s*$''',
    '''^Disconnecting: Too many authentication failures(?: for \S+|.*?)?(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^(?:Connection (?:closed|reset)|Disconnect(?:ed|ing))(?: (?:by|from))?(?: (?:invalid|authenticating) user \S+|.*?)?(?: from)? \S+(?: port \d+)?(?:: [^\[]+)?(?: \[preauth\])?\s*$''',
    '''^(?:Connection (?:closed|reset)|Disconnect(?:ed|ing))(?: (?:by|from))?(?: (?:invalid|authenticating) user \S+|.*?)?(?: from)? \S+(?: port \d+)?(?:: [^\[]+)?\s+\[preauth\]\s*$''',
    '''^(?:Connection (?:closed|reset)|Disconnect(?:ed|ing))(?: (?:by|from))?(?: (?:invalid|authenticating) user \S+|.*?)?(?: from)? \S+(?:(?: port \d+)?(?:: [^\[]+)?|\s*)$''',

    '''^(?:Did not receive identification string from|Timeout before authentication for(?: connection from)?) \S+''',
    '''^kex_exchange_identification: (?:read: )?(?:[Cc]lient sent invalid protocol identifier|[Cc]onnection (?:closed by remote host|reset by peer))''',
    '''^Bad protocol version identification '(?:[^']|.*?)' (?:from )?\S+(?: port \d+)?(?: \[preauth\])?\s*$''',
    '''^SSH: Server;Ltype: (?:Authname|Version|Kex);Remote: \S+-\d+;[A-Z]\w+:''',
    '''^(?:banner exchange|ssh_dispatch_run_fatal): Connection from \S+(?: port \d+)?: (?:invalid format|(?:message authentication code incorrect|[Cc]onnection corrupted) \[preauth\])''',
]
ignore = [
    '''^Read from socket failed: Connection reset by peer''',
    '''^Received disconnect from \S+(?: port \d+)?:\s*11:''',
    '''^Received disconnect from \S+(?: port \d+)?:\s*14: No(?: supported)? authentication methods available''',
    '''^Unable to negotiate with \S+(?: port \d+)?: no matching (?:(?:\w+ ){0,2}\w+) found.''',
    '''^Unable to negotiate a (?:(?:\w+ ){0,2}\w+)''',
    '''^no matching (?:(?:\w+ ){0,2}\w+) found:''',

]
accept = [
    '''^Accepted \w+ for \S+ from \S+(?:\s|$)''',
] # e.g. previous fails will be erased for this ip