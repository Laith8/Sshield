[package]
name = "sshield"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
inotify = "0.11.5"
regex = "1.13.2"
serde = { version = "1.0", features = ["derive"] }
systemd = {version="0.11.1",features=["journal"]}
toml = "1.2.2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false